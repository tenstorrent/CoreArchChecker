name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Enforce REUSE (https://reuse.software) licensing compliance: every file must
  # carry an SPDX license/copyright header or be covered by REUSE.toml.
  # reuse is installed into a venv because the image's Debian bookworm has a
  # PEP-668 managed system pip. The [charset-normalizer] extra provides reuse's
  # encoding detector in pure Python, so no libmagic/`file` package is needed.
  license-check:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/tenstorrent/cvm:0.1.3
    steps:
      - uses: actions/checkout@v4
      - name: REUSE lint
        run: |
          python3 -m venv /tmp/reuse-venv
          /tmp/reuse-venv/bin/pip install --quiet --no-cache-dir "reuse[charset-normalizer]==6.2.0"
          /tmp/reuse-venv/bin/reuse lint

  # Build + run the full test suite (GoogleTest via Bazel / WORKSPACE).
  smoke:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/tenstorrent/cvm:0.1.3
    steps:
      - uses: actions/checkout@v4
      - name: Bazel test //tests/...
        run: bazel --output_user_root=./bazel_output_user_root test //tests/... --test_output=all
